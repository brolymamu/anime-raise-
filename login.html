<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Login or Create Account - AniVerse</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body class="auth-body">

<div class="auth-box">

    <div class="logo">
        Ani<span>Verse</span>
    </div>

        <h1>Welcome Back</h1>

    <p>Login or create an account to save favorites and continue watching.</p>

    <input
        id="email"
        type="email"
        placeholder="Email"
    >

    <input
        id="password"
        type="password"
        placeholder="Password"
    >

        <button
        class="btn primary full"
        onclick="loginUser()"
    >
        Login
    </button>

    <button
        class="btn secondary full"
        onclick="createAccount()"
        style="margin-top:10px"
    >
        Create Account
    </button>

    <p class="auth-message" id="loginMessage"></p>

    <a href="index.html">
        ← Back to Home
    </a>

</div>

<script src="js/app.js"></script>

</body>
</html>
